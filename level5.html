<!DOCTYPE html>
<html data-bs-theme="dark">
    <head>
        <title>The Button - Level 5</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
            crossorigin="anonymous">
        <style>body {
            user-select: none;
        }</style>
    </head>
    <body>
        <h1>Level 5</h1>
        <h3><em>SHHHHHHH!</em></h3>
        <button onclick="tryClick(event)"
            class="btn btn-success" hidden>ggezlolz</button>
        <button onclick="tryClick(event)"
            class="btn btn-danger" hidden>TheButtonHater</button>
        <script>
           const h3 = document.getElementsByTagName("h3")[0]
           setTimeout(() => {
            h3.innerHTML = "There is <span style='color: red'>1 impostor</span> among us."
            setTimeout(() => {
                const names = ["TheButtonPlayer", "ggezlolz", "Hello", "Nythal", "carrot", "ImAHacker"]
                const questions = ["Who???", "??????", "What?", "Why?", "Who is the impostor?", "Where was the body?"]
                h3.innerText = names[Math.floor(Math.random() * names.length)] + ": " + questions[Math.floor(Math.random() * questions.length)]
                h3.style.color = "blue"
                for (let i = 0; i < 2; i++) {
                    document.getElementsByTagName("button")[i].removeAttribute("hidden")
                    document.getElementsByTagName("button")[i].innerText = names[Math.floor(Math.random() * names.length)]
                }
            }, 3000)
           }, 3000)
           function tryClick(e) {
            for (let i = 0; i < 2; i++) {
                    document.getElementsByTagName("button")[i].setAttribute("hidden", true)
                }
                h3.style.color = "white"
                const bools = [true, false]
            const won = bools[Math.floor(Math.random() * 2)]
            if (won) {
            h3.innerText = e.target.innerText + " was the impostor."
            } else {
            h3.innerText = e.target.innerText + " was not the impostor."
            }
            setTimeout(() => {
                if (won) {
            window.location.href = "checkpoint.html?level=6"
            } else {
                window.location.href = "gameover.html?level=1"
            }
            }, 3000);
           }
        </script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>
    </body>
</html>
