<!DOCTYPE html>
<html data-bs-theme="dark">
<head>
    <title>The Button - Level 6</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            user-select: none;
            text-align: center;
            padding-top: 100px;
        }
        #btn {
            width: 150px;
            height: 60px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <h1>Level 6</h1>
    <h3>Click the GREEN button only!</h3>
    <button id="btn" class="btn btn-success">Level 7</button>

    <script>
        const btn = document.getElementById("btn");

        const colors = ['btn-success','btn-danger','btn-warning','btn-primary','btn-info','btn-dark'];
        const correctColor = 'btn-success';

        btn.onclick = () => {
            if (btn.classList.contains(correctColor)) {
                    window.location.href = "level7.html";
            } else {
                window.location.href = "gameover.html?level=5"
            }
        }

        setInterval(() => {
            btn.className = 'btn ' + colors[Math.floor(Math.random() * colors.length)];
        }, 500);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
