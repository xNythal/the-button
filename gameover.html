<!DOCTYPE html>
<html data-bs-theme="dark">
    <head>
        <title>The Button - Game Over</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
        <style>body {
            user-select: none;
        }</style>
    </head>
    <body>
        <h1 style="color: darkred;">Game Over</h1>
        <h3>I overestimated your power.</h3>
        <button id="btn" onclick="window.location.href='index.html'" class="btn btn-success">Home Page</button>
        <script>
            const params = new URLSearchParams(window.location.search);
            const btn = document.getElementById("btn")
            const level = params.get("level");
            if (level === null) {
                throw new Error("No Level Query Param")
            }

            btn.onclick = () => {
                window.location.href = "level" + level + ".html";
            }
            btn.innerText = "Level " + level;
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    </body>
</html>
