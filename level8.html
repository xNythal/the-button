        <script>
            const btns = document.getElementsByTagName("button")
            const correct = btns[Math.floor(Math.random()*btns.length)]
              correct.addEventListener("mouseover", () => {
    correct.style.backgroundColor = "darkgreen"
  })
  correct.addEventListener("mouseout", () => {
    correct.style.backgroundColor = ""
  })
  correct.onclick = () => {
    window.location.href = "level9.html"
  }
        </script>

            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
